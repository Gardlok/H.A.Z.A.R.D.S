[package]
name = "hazards-cli"
description = "Command-line control plane for the HAZARDS terminal workspace"
default-run = "hazards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hazards"
path = "src/main.rs"

[[bin]]
name = "hazards-source-prepare"
path = "src/bin/hazards-source-prepare.rs"

[[bin]]
name = "hazards-cargo-dependencies"
path = "src/bin/hazards-cargo-dependencies.rs"

[[bin]]
name = "hazards-build-contract"
path = "src/bin/hazards-build-contract.rs"

[[bin]]
name = "hazards-source-build"
path = "src/bin/hazards-source-build.rs"

[dependencies]
arsenallspice.workspace = true
clap.workspace = true
hazards-core.workspace = true
rhaisour.workspace = true
serde_json.workspace = true
