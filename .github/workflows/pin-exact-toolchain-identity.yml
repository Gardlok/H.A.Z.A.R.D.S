name: Pin exact toolchain identity

on:
  push:
    branches:
      - agent/pinned-build-contract

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pinned-build-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Pin probed identities and capture validation
        run: |
          set -u
          : > .hazards-toolchain-pin-validation.log
          status=0
          python3 - <<'PY' >> .hazards-toolchain-pin-validation.log 2>&1 || status=1
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} anchor(s), found {actual}')
              file.write_text(text.replace(old, new))

          replace_exact(
              'ingredients/arsenallspice/build-contracts.toml',
              'cargo_release = "1.97.1"\nllvm_major = 21',
              'cargo_release = "1.97.1"\ncargo_commit_hash = "c980f4866141969fab6254a680546a277789d6f0"\ncargo_commit_date = "2026-06-30"\nllvm_major = 22',
              2,
          )
          replace_exact(
              'crates/hazards-core/src/build_contract.rs',
              '    pub cargo_release: String,\n    pub llvm_major: u32,',
              '    pub cargo_release: String,\n    pub cargo_commit_hash: String,\n    pub cargo_commit_date: String,\n    pub llvm_major: u32,',
          )
          replace_exact(
              'crates/hazards-core/src/build_contract/planner.rs',
              '''                || !valid_lower_hex(&contract.rustc_commit_hash, 40)
                              || !valid_date(&contract.rustc_commit_date)
                              || contract.llvm_major == 0
              ''',
              '''                || !valid_lower_hex(&contract.rustc_commit_hash, 40)
                              || !valid_date(&contract.rustc_commit_date)
                              || !valid_lower_hex(&contract.cargo_commit_hash, 40)
                              || !valid_date(&contract.cargo_commit_date)
                              || contract.llvm_major == 0
              ''',
          )
          replace_exact(
              'crates/hazards-core/src/build_contract/probe_support.rs',
              '''        || cargo_commit_hash
                          .as_deref()
                          .is_some_and(|value| value != contract.rustc_commit_hash)
                      || cargo_commit_date
                          .as_deref()
                          .is_some_and(|value| value != contract.rustc_commit_date)
              ''',
              '''        || cargo_commit_hash.as_deref() != Some(contract.cargo_commit_hash.as_str())
                      || cargo_commit_date.as_deref() != Some(contract.cargo_commit_date.as_str())
              ''',
          )
          replace_exact(
              'crates/hazards-core/src/build_contract/probe_support.rs',
              '"toolchain identity mismatch: rustc {rustc_release} {rustc_commit_hash} {rustc_commit_date}, cargo {cargo_release}, host {host}, LLVM {llvm_version}"',
              '"toolchain identity mismatch: rustc {rustc_release} {rustc_commit_hash} {rustc_commit_date}, cargo {cargo_release} {} {}, host {host}, LLVM {llvm_version}", cargo_commit_hash.as_deref().unwrap_or("missing"), cargo_commit_date.as_deref().unwrap_or("missing")',
          )
          replace_exact(
              'docs/BUILD_CONTRACT.md',
              '- LLVM major version 21;',
              '- Cargo commit `c980f4866141969fab6254a680546a277789d6f0` dated `2026-06-30`;\n- LLVM major version 22;',
          )
          identity = Path('.hazards-pinned-toolchain-identity.txt')
          if identity.exists():
              identity.unlink()
          PY
          for command in \
            'cargo fmt --all' \
            'cargo check --workspace' \
            'cargo clippy --workspace --all-targets -- -D warnings' \
            'cargo test --workspace'
          do
            printf '\n$ %s\n' "$command" >> .hazards-toolchain-pin-validation.log
            if ! bash -o pipefail -c "$command" >> .hazards-toolchain-pin-validation.log 2>&1; then
              status=1
            fi
          done
          printf '\nvalidation_status=%s\n' "$status" >> .hazards-toolchain-pin-validation.log
      - name: Commit result
        run: |
          set -euo pipefail
          status="$(sed -n 's/^validation_status=//p' .hazards-toolchain-pin-validation.log | tail -1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test "$status" = 0
          then
            rm -- .hazards-toolchain-pin-validation.log
            rm -- .github/workflows/pin-exact-toolchain-identity.yml
            git add --all
            git commit -m 'Pin exact Rust and Cargo toolchain identity'
          else
            git add --all
            git commit -m 'Record exact toolchain pin failure'
          fi
          git push origin HEAD:agent/pinned-build-contract
