name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Stable quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: CLI smoke checks
        run: |
          cargo run -p hazards-cli -- about
          cargo run -p hazards-cli -- arsenal list
          cargo run -p hazards-cli -- profile resolve --host remote --persistence ghost --role operations
          cargo run -p hazards-cli -- provision plan --host remote --persistence ghost --role operations --json
          cargo run -p hazards-cli -- recipe check

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace
