name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Stable quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format working tree
        run: cargo fmt --all
      - name: Commit rustfmt output
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/hazards-cli/src/bin/hazards-source-prepare.rs \
            crates/hazards-core/src/source_prepare.rs \
            crates/hazards-core/src/source_prepare/archive.rs \
            crates/hazards-core/src/source_prepare/evidence.rs \
            crates/hazards-core/src/source_prepare/tests.rs
          if ! git diff --cached --quiet; then
            git commit -m "Apply rustfmt"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: CLI smoke checks
        run: |
          cargo run -p hazards-cli -- about
          cargo run -p hazards-cli -- arsenal list
          cargo run -p hazards-cli -- profile resolve --host remote --persistence ghost --role operations
          cargo run -p hazards-cli -- provision plan --host remote --persistence ghost --role operations --json
          cargo run -p hazards-cli -- provision acquire-plan --host remote --persistence ghost --role operations --json
          cargo run -p hazards-cli -- provision build-plan --tool alacritty --host desktop --persistence local --role development --json
          cargo run -p hazards-cli -- provision acquire --help
          cargo run -p hazards-cli -- provision materialize --help
          cargo run -p hazards-cli -- provision install --help
          cargo run -p hazards-cli -- provision rollback --help
          cargo run -p hazards-cli --bin hazards-source-prepare -- --help
          HAZARDS_CI_HOME="$(mktemp -d)"
          HOME="$HAZARDS_CI_HOME" \
            XDG_STATE_HOME="$HAZARDS_CI_HOME/state" \
            XDG_CACHE_HOME="$HAZARDS_CI_HOME/cache" \
            cargo run -p hazards-cli -- dotfiles generate --host remote --persistence ghost --role operations --json
          HOME="$HAZARDS_CI_HOME" \
            XDG_STATE_HOME="$HAZARDS_CI_HOME/state" \
            XDG_CACHE_HOME="$HAZARDS_CI_HOME/cache" \
            cargo run -p hazards-cli -- dotfiles plan --host remote --persistence ghost --role operations --json
          cargo run -p hazards-cli -- dotfiles dry-run --help
          cargo run -p hazards-cli -- dotfiles deploy --help
          cargo run -p hazards-cli -- dotfiles rollback --help
          cargo run -p hazards-cli -- recipe check

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace
