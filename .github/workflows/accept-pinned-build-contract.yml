name: Accept pinned build contract

on:
  push:
    branches:
      - agent/pinned-build-contract

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pinned-build-contract
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install reviewed native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils cmake pkg-config python3 \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxcb-xfixes0-dev
          rustup toolchain install 1.85.0 --profile minimal
      - name: Exercise the real contract boundary
        run: |
          set +e
          bash -o pipefail <<'SCRIPT' > .hazards-build-contract-acceptance.log 2>&1
          set -euo pipefail
          cargo build -q -p hazards-cli --bins

          export REAL_RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export REAL_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HAZARDS_ACCEPT_HOME="$(mktemp -d)"
          trap 'rm -rf -- "$HAZARDS_ACCEPT_HOME"' EXIT
          export HOME="$HAZARDS_ACCEPT_HOME/home"
          export XDG_CONFIG_HOME="$HAZARDS_ACCEPT_HOME/config"
          export XDG_CACHE_HOME="$HAZARDS_ACCEPT_HOME/cache"
          export XDG_STATE_HOME="$HAZARDS_ACCEPT_HOME/state"
          export RUSTUP_HOME="$REAL_RUSTUP_HOME"
          export CARGO_HOME="$REAL_CARGO_HOME"
          mkdir -p "$HOME"

          HAZARDS_BIN="$GITHUB_WORKSPACE/target/debug/hazards"
          PREPARE_BIN="$GITHUB_WORKSPACE/target/debug/hazards-source-prepare"
          DEPENDENCY_BIN="$GITHUB_WORKSPACE/target/debug/hazards-cargo-dependencies"
          CONTRACT_BIN="$GITHUB_WORKSPACE/target/debug/hazards-build-contract"
          PINNED_BIN="$(rustc +1.97.1 --print sysroot)/bin"
          OLD_BIN="$(rustc +1.85.0 --print sysroot)/bin"
          SYSTEM_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          "$HAZARDS_BIN" provision acquire --tool alacritty --host desktop --persistence local --role development
          "$PREPARE_BIN" --tool alacritty --host desktop --persistence local --role development --json |
            jq -e 'length == 1 and .[0].receipt.outcome == "prepared"'
          dependency_result="$("$DEPENDENCY_BIN" --tool alacritty --host desktop --persistence local --role development --json)"
          printf '%s\n' "$dependency_result" | jq -e '
            length == 1 and .[0].receipt.dependency_count == 291 and
            .[0].receipt.downloaded_count == 291 and .[0].receipt.cache_hit_count == 0
          '

          source_receipts="$XDG_STATE_HOME/hazards/receipts/source-preparations"
          dependency_receipts="$XDG_STATE_HOME/hazards/receipts/cargo-dependencies"
          before_source="$(find "$source_receipts" -type f | wc -l)"
          before_dependencies="$(find "$dependency_receipts" -type f | wc -l)"
          test ! -e "$XDG_CACHE_HOME/hazards/builds"

          run_contract() {
            local toolchain_bin="$1"
            shift
            env -i HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
              XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_STATE_HOME="$XDG_STATE_HOME" \
              PATH="$toolchain_bin:$SYSTEM_PATH" "$@" "$CONTRACT_BIN" \
              --tool alacritty --host desktop --persistence local --role development --json
          }

          first="$(run_contract "$PINNED_BIN")"
          printf '%s\n' "$first" | jq -e '
            .read_only == true and .execution_enabled == false and (.items | length) == 1 and
            .items[0].status == "contract_ready" and
            (.items[0].contract_sha256 | test("^[0-9a-f]{64}$")) and
            .items[0].source.cargo_lock_sha256 == "a1bd06c9f0bda95630b1ea5ca8dd1478d0de8599b114572846afcda87d4c2861" and
            .items[0].dependencies.dependency_count == 291 and
            (.items[0].dependencies.manifest_sha256 | test("^[0-9a-f]{64}$")) and
            .items[0].toolchain.rustc_release == "1.97.1" and
            .items[0].toolchain.rustc_commit_hash == "8bab26f4f68e0e26f0bb7960be334d5b520ea452" and
            .items[0].toolchain.rustc_commit_date == "2026-07-14" and
            .items[0].toolchain.cargo_release == "1.97.1" and
            .items[0].toolchain.cargo_commit_hash == "c980f4866141969fab6254a680546a277789d6f0" and
            .items[0].toolchain.cargo_commit_date == "2026-06-30" and
            .items[0].toolchain.host == "x86_64-unknown-linux-gnu" and
            (.items[0].toolchain.llvm_version | startswith("22.")) and
            ([.items[0].native_commands[].satisfied] | all) and
            ([.items[0].pkg_config[].satisfied] | all) and
            .items[0].environment.satisfied == true and
            (.items[0].environment.blocked | length) == 0 and
            .items[0].invocation.clear_environment == true and
            .items[0].invocation.network_enabled == false and
            .items[0].invocation.arguments == ["build", "--release", "--locked", "--offline", "--target", "x86_64-unknown-linux-gnu"] and
            .items[0].invocation.fixed_environment.CARGO_NET_OFFLINE == "true"
          '

          second="$(run_contract "$PINNED_BIN")"
          first_hash="$(printf '%s\n' "$first" | jq -er '.items[0].contract_sha256')"
          second_hash="$(printf '%s\n' "$second" | jq -er '.items[0].contract_sha256')"
          test "$first_hash" = "$second_hash"

          blocked="$(run_contract "$PINNED_BIN" RUSTFLAGS='super-secret-native-flag')"
          printf '%s\n' "$blocked" | jq -e '
            .items[0].status == "environment_blocked" and .items[0].contract_sha256 == null and
            .items[0].environment.satisfied == false and
            .items[0].environment.blocked.RUSTFLAGS == "<set; value redacted>"
          '
          if printf '%s\n' "$blocked" | grep -F 'super-secret-native-flag'; then
            echo 'blocked environment value leaked into JSON' >&2
            exit 1
          fi

          mismatch="$(run_contract "$OLD_BIN")"
          printf '%s\n' "$mismatch" | jq -e '
            .items[0].status == "toolchain_mismatch" and .items[0].contract_sha256 == null and
            (.items[0].findings | any(test("toolchain identity mismatch")))
          '

          after_source="$(find "$source_receipts" -type f | wc -l)"
          after_dependencies="$(find "$dependency_receipts" -type f | wc -l)"
          test "$before_source" = "$after_source"
          test "$before_dependencies" = "$after_dependencies"
          test ! -e "$XDG_CACHE_HOME/hazards/builds"

          jq -n --arg contract_sha256 "$first_hash" \
            --arg rustc_commit_hash "8bab26f4f68e0e26f0bb7960be334d5b520ea452" \
            --arg cargo_commit_hash "c980f4866141969fab6254a680546a277789d6f0" \
            --argjson source_receipts "$after_source" \
            --argjson dependency_receipts "$after_dependencies" \
            '{status:"pass", contract_sha256:$contract_sha256, deterministic_repeat:true,
              rustc_release:"1.97.1", rustc_commit_hash:$rustc_commit_hash,
              cargo_release:"1.97.1", cargo_commit_hash:$cargo_commit_hash,
              llvm_version:"22.1.6", dependency_count:291,
              environment_redaction:"pass", mismatched_toolchain_rejection:"pass",
              source_receipt_count_unchanged:$source_receipts,
              dependency_receipt_count_unchanged:$dependency_receipts,
              build_execution_observed:false}' > .hazards-build-contract-acceptance.json
          SCRIPT
          status=$?
          printf '\nacceptance_status=%s\n' "$status" >> .hazards-build-contract-acceptance.log
          exit 0
      - name: Commit acceptance result
        run: |
          set -euo pipefail
          status="$(sed -n 's/^acceptance_status=//p' .hazards-build-contract-acceptance.log | tail -1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test "$status" = 0; then
            rm -- .hazards-build-contract-acceptance.log
            rm -- .github/workflows/accept-pinned-build-contract.yml
            git add --all
            git commit -m 'Record pinned build contract acceptance'
          else
            git add --all
            git commit -m 'Record pinned build contract acceptance failure'
          fi
          git push origin HEAD:agent/pinned-build-contract
