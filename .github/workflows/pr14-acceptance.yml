name: PR14 real source-build acceptance

on:
  push:
    branches: [agent/controlled-source-build]

permissions:
  contents: write

jobs:
  alacritty:
    if: ${{ !startsWith(github.event.head_commit.message, 'Record temporary PR14 acceptance') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/controlled-source-build
      - name: Execute unprivileged HAZARDS build in Debian 12
        shell: bash
        run: |
          set +e
          rm -rf acceptance
          mkdir -p acceptance
          docker run --rm --privileged \
            --env WORKSPACE_UID="$(stat -c %u "$GITHUB_WORKSPACE")" \
            --env WORKSPACE_GID="$(stat -c %g "$GITHUB_WORKSPACE")" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:12 \
            bash .github/pr14-acceptance.sh
          status=$?
          printf '%s\n' "$status" > acceptance/docker-exit-status.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr14-source-build-acceptance
          path: acceptance/
          if-no-files-found: warn
      - name: Record temporary acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pr14-acceptance
          mkdir -p pr14-acceptance
          if test -d acceptance; then
            cp -a acceptance/. pr14-acceptance/
          fi
          printf '%s\n' '${{ job.status }}' > pr14-acceptance/job-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pr14-acceptance
          git diff --cached --quiet && exit 0
          git commit -m "Record temporary PR14 acceptance evidence"
          git push origin HEAD:agent/controlled-source-build
