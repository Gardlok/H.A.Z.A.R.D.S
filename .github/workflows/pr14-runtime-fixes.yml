name: PR14 runtime fixes

on:
  push:
    branches: [agent/controlled-source-build]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/controlled-source-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          materialize = Path("crates/hazards-core/src/build_execution/materialize.rs")
          text = materialize.read_text()
          if "refusing concurrent or stale execution state" not in text:
              old = '''    match fs::symlink_metadata(build_root) {
                  Ok(_) => {
                      return Err(SourceBuildError::UnsafePath {
                          path: build_root.to_path_buf(),
                          reason: "build root already exists; refusing to reuse stale execution state"
                              .to_owned(),
                      });
                  }
                  Err(error) if error.kind() == io::ErrorKind::NotFound => {}
                  Err(error) => return Err(io_error("inspect build root", build_root, error)),
              }
              ensure_private_directory(build_root)?;

              let source = contract
                  .source
                  .as_ref()
                  .ok_or(SourceBuildError::MissingSourceEvidence)?;
              let dependencies = contract
                  .dependencies
                  .as_ref()
                  .ok_or(SourceBuildError::MissingDependencyEvidence)?;
              '''
              new = '''    let source = contract
                  .source
                  .as_ref()
                  .ok_or(SourceBuildError::MissingSourceEvidence)?;
              let dependencies = contract
                  .dependencies
                  .as_ref()
                  .ok_or(SourceBuildError::MissingDependencyEvidence)?;
              let expected_build_root = paths
                  .cache
                  .join("builds")
                  .join(&source.artifact_sha256[..2])
                  .join(&source.artifact_sha256);
              if build_root != expected_build_root {
                  return Err(SourceBuildError::UnsafePath {
                      path: build_root.to_path_buf(),
                      reason: "build root does not match the contract-bound cache path".to_owned(),
                  });
              }
              let build_parent = build_root.parent().ok_or_else(|| {
                  SourceBuildError::Validation("private build root has no parent".to_owned())
              })?;
              ensure_private_directory(build_parent)?;
              match fs::create_dir(build_root) {
                  Ok(()) => ensure_private_directory(build_root)?,
                  Err(error) if error.kind() == io::ErrorKind::AlreadyExists => {
                      return Err(SourceBuildError::UnsafePath {
                          path: build_root.to_path_buf(),
                          reason: "build root already exists; refusing concurrent or stale execution state"
                              .to_owned(),
                      });
                  }
                  Err(error) => return Err(io_error("create private build root", build_root, error)),
              }

              '''
              assert text.count(old) == 1
              materialize.write_text(text.replace(old, new))

          process = Path("crates/hazards-core/src/build_execution/process.rs")
          text = process.read_text()
          if "before process exit was observed" not in text:
              old = '''    let mut outcome = outcome;
              let mut detail = detail;
              for path in [&stdout_path, &stderr_path] {
              '''
              new = '''    let mut outcome = outcome;
              let mut detail = detail;
              if matches!(outcome, ProcessOutcome::Succeeded | ProcessOutcome::Failed) {
                  match (file_length(&stdout_path), file_length(&stderr_path)) {
                      (Ok(stdout), Ok(stderr))
                          if stdout.saturating_add(stderr) > limits.maximum_output_bytes =>
                      {
                          outcome = ProcessOutcome::OutputLimitExceeded;
                          detail = format!(
                              "combined output exceeded {} bytes before process exit was observed",
                              limits.maximum_output_bytes
                          );
                      }
                      (Ok(_), Ok(_)) => {}
                      (left, right) => {
                          let error = left.err().or_else(|| right.err()).expect("one size failed");
                          outcome = ProcessOutcome::Ambiguous;
                          detail = format!("could not observe final build output size: {error}");
                      }
                  }
              }
              if matches!(outcome, ProcessOutcome::Succeeded | ProcessOutcome::Failed) {
                  match directory_size_bounded(build_root, limits.maximum_build_bytes) {
                      Ok(size) if size > limits.maximum_build_bytes => {
                          outcome = ProcessOutcome::FilesystemLimitExceeded;
                          detail = format!(
                              "build tree exceeded {} bytes before process exit was observed",
                              limits.maximum_build_bytes
                          );
                      }
                      Ok(_) => {}
                      Err(error) => {
                          outcome = ProcessOutcome::Ambiguous;
                          detail = format!("could not observe final build-tree size: {error}");
                      }
                  }
              }
              for path in [&stdout_path, &stderr_path] {
              '''
              assert text.count(old) == 1
              process.write_text(text.replace(old, new))
          PY
          cargo fmt --all
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hazards-core/src/build_execution/materialize.rs \
                  crates/hazards-core/src/build_execution/process.rs
          git diff --cached --quiet && exit 0
          git commit -m "Close source-build execution races"
          git push origin HEAD:agent/controlled-source-build
