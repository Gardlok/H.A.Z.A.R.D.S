name: Patch build contract verifiers

on:
  push:
    branches:
      - agent/pinned-build-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pinned-build-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add read-only evidence verification APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('crates/hazards-core/src/source_prepare.rs')
          source = source_path.read_text()
          source_struct = '''pub struct PreparedSource {
              pub staging_path: PathBuf,
              pub source_path: PathBuf,
              pub manifest_path: PathBuf,
              pub receipt_path: PathBuf,
              pub receipt: SourcePreparationReceipt,
          }
          '''
          verified_struct = source_struct + '''
          /// Read-only verification of an existing prepared source stage.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize)]
          pub struct VerifiedPreparedSource {
              pub staging_path: PathBuf,
              pub source_path: PathBuf,
              pub manifest_path: PathBuf,
              pub cargo_manifest_path: PathBuf,
              pub cargo_lock_path: PathBuf,
              pub artifact_sha256: String,
              pub manifest_sha256: String,
              pub cargo_lock_sha256: String,
              pub cargo_lock_version: u32,
              pub package_count: usize,
              pub registry_package_count: usize,
              pub local_package_count: usize,
              pub entry_count: usize,
              pub expanded_size: u64,
          }
          '''
          assert source.count(source_struct) == 1
          source = source.replace(source_struct, verified_struct)
          resolve_anchor = "    fn resolve<'a>(\n"
          verify_method = '''    /// Revalidate an existing source stage without creating state or receipts.
              pub fn verify_existing(
                  &self,
                  item: &AcquisitionItem,
              ) -> Result<VerifiedPreparedSource, SourcePreparationError> {
                  let (artifact, source_lock, _object_path) = self.resolve(item)?;
                  let staging_path = self
                      .cache_root
                      .join("sources")
                      .join("sha256")
                      .join(&artifact.sha256[..2])
                      .join(&artifact.sha256);
                  let manifest = validate_existing_stage(&staging_path, artifact, source_lock)?;
                  let expanded_size = manifest
                      .entries
                      .iter()
                      .filter(|entry| entry.kind == PreparedSourceEntryKind::File)
                      .try_fold(0_u64, |total, entry| total.checked_add(entry.size))
                      .ok_or(SourcePreparationError::ExpandedTooLarge {
                          maximum: MAX_EXPANDED_SIZE,
                      })?;
                  let source_path = staging_path.join(&source_lock.root);
                  Ok(VerifiedPreparedSource {
                      manifest_path: staging_path.join(MANIFEST_NAME),
                      cargo_manifest_path: source_path.join("Cargo.toml"),
                      cargo_lock_path: source_path.join("Cargo.lock"),
                      staging_path,
                      source_path,
                      artifact_sha256: artifact.sha256.clone(),
                      manifest_sha256: source_lock.manifest_sha256.clone(),
                      cargo_lock_sha256: source_lock.cargo_lock_sha256.clone(),
                      cargo_lock_version: source_lock.cargo_lock_version,
                      package_count: source_lock.package_count,
                      registry_package_count: manifest.registry_package_count,
                      local_package_count: manifest.local_package_count,
                      entry_count: manifest.entries.len(),
                      expanded_size,
                  })
              }

          '''
          assert source.count(resolve_anchor) == 1
          source = source.replace(resolve_anchor, verify_method + resolve_anchor)
          source_path.write_text(source)

          dependency_path = Path('crates/hazards-core/src/cargo_dependency.rs')
          dependency = dependency_path.read_text()
          cached_struct = '''pub struct CachedCargoDependencies {
              pub object_root: PathBuf,
              pub manifest_path: PathBuf,
              pub receipt_path: PathBuf,
              pub packages: Vec<CachedCargoDependency>,
              pub receipt: CargoDependencyReceipt,
          }
          '''
          verified_dependencies = cached_struct + '''
          /// Read-only verification of a complete existing Cargo dependency cache.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize)]
          pub struct VerifiedCargoDependencies {
              pub object_root: PathBuf,
              pub manifest_path: PathBuf,
              pub manifest_sha256: String,
              pub packages: Vec<CachedCargoDependency>,
              pub dependency_count: usize,
              pub total_bytes: u64,
          }
          '''
          assert dependency.count(cached_struct) == 1
          dependency = dependency.replace(cached_struct, verified_dependencies)
          acquire_anchor = '''    fn acquire_package(
          '''
          verify_dependencies = '''    /// Revalidate an existing dependency graph without network access or receipts.
              pub fn verify_existing(
                  &self,
                  item: &AcquisitionItem,
              ) -> Result<VerifiedCargoDependencies, CargoDependencyError> {
                  let (artifact, source_lock) = resolve_item(item)?;
                  let prepared =
                      SourcePreparer::new(self.cache_root.clone(), self.state_root.clone())
                          .verify_existing(item)?;
                  let lock_bytes = read_locked_file(&prepared.cargo_lock_path, source_lock)?;
                  let dependencies = parse_dependencies(
                      &lock_bytes,
                      &source_lock.package,
                      &artifact.version,
                      source_lock,
                  )?;
                  let object_root = self
                      .cache_root
                      .join("cargo")
                      .join("objects")
                      .join("sha256");
                  let mut packages = Vec::with_capacity(dependencies.len());
                  for dependency in &dependencies {
                      let object_path = object_root
                          .join(&dependency.checksum[..2])
                          .join(&dependency.checksum);
                      let size = verify_dependency_object(&object_path, &dependency.checksum)?;
                      packages.push(cached_dependency(
                          dependency,
                          size,
                          object_path,
                          CargoDependencyOutcome::CacheHit,
                      ));
                  }
                  let manifest = CargoDependencyManifest {
                      schema_version: MANIFEST_SCHEMA_VERSION,
                      tool_id: item.id.clone(),
                      version: item.target_version.clone(),
                      artifact_sha256: artifact.sha256.clone(),
                      cargo_lock_sha256: source_lock.cargo_lock_sha256.clone(),
                      cargo_lock_version: source_lock.cargo_lock_version,
                      package_count: source_lock.package_count,
                      dependency_count: packages.len(),
                      packages: packages
                          .iter()
                          .map(|package| CargoDependencyManifestEntry {
                              name: package.name.clone(),
                              version: package.version.clone(),
                              checksum: package.checksum.clone(),
                              source_url: package.source_url.clone(),
                              size: package.size,
                          })
                          .collect(),
                  };
                  let manifest_path = self
                      .cache_root
                      .join("cargo")
                      .join("dependency-graphs")
                      .join("sha256")
                      .join(&source_lock.cargo_lock_sha256[..2])
                      .join(format!("{}.json", source_lock.cargo_lock_sha256));
                  let encoded = encode_json(&manifest)?;
                  validate_manifest_file(&manifest_path, &manifest, &encoded)?;
                  let total_bytes = packages.iter().map(|package| package.size).sum();
                  Ok(VerifiedCargoDependencies {
                      object_root,
                      manifest_path,
                      manifest_sha256: hash_bytes(&encoded),
                      dependency_count: packages.len(),
                      total_bytes,
                      packages,
                  })
              }

          '''
          assert dependency.count(acquire_anchor) == 1
          dependency = dependency.replace(acquire_anchor, verify_dependencies + acquire_anchor)
          dependency_path.write_text(dependency)

          workflow = Path('.github/workflows/patch-build-contract-verifiers.yml')
          workflow.unlink()
          PY
          cargo fmt --all
          cargo test --workspace
      - name: Commit verifier APIs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/hazards-core/src/source_prepare.rs crates/hazards-core/src/cargo_dependency.rs .github/workflows/patch-build-contract-verifiers.yml
          git commit -m 'Add read-only build evidence verifiers'
          git push origin HEAD:agent/pinned-build-contract
