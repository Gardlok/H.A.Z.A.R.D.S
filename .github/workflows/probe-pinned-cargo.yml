name: Probe pinned Cargo identity

on:
  push:
    branches:
      - agent/pinned-build-contract

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Cargo identity
        run: |
          cargo -Vv
          rustc -vV
