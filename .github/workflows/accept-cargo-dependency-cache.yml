name: Accept Cargo dependency cache

on:
  push:
    branches:
      - agent/offline-cargo-dependency-cache

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offline-cargo-dependency-cache
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise real locked dependency graph
        run: |
          set -euo pipefail
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HAZARDS_ACCEPT_HOME="$(mktemp -d)"
          trap 'rm -rf -- "$HAZARDS_ACCEPT_HOME"' EXIT
          export HOME="$HAZARDS_ACCEPT_HOME/home"
          export XDG_CONFIG_HOME="$HAZARDS_ACCEPT_HOME/config"
          export XDG_CACHE_HOME="$HAZARDS_ACCEPT_HOME/cache"
          export XDG_STATE_HOME="$HAZARDS_ACCEPT_HOME/state"
          mkdir -p "$HOME"

          cargo run -q -p hazards-cli -- provision acquire \
            --tool alacritty \
            --host desktop \
            --persistence local \
            --role development

          cargo run -q -p hazards-cli --bin hazards-source-prepare -- \
            --tool alacritty \
            --host desktop \
            --persistence local \
            --role development \
            --json | jq -e 'length == 1 and .[0].receipt.outcome == "prepared"'

          first="$(
            cargo run -q -p hazards-cli --bin hazards-cargo-dependencies -- \
              --tool alacritty \
              --host desktop \
              --persistence local \
              --role development \
              --json
          )"
          printf '%s\n' "$first" | jq -e '
            length == 1 and
            .[0].receipt.outcome == "populated" and
            .[0].receipt.dependency_count == 291 and
            .[0].receipt.downloaded_count == 291 and
            .[0].receipt.cache_hit_count == 0 and
            (. [0].receipt.total_bytes > 0) and
            (. [0].packages | length == 291)
          '

          object_root="$(printf '%s\n' "$first" | jq -er '.[0].object_root')"
          manifest="$(printf '%s\n' "$first" | jq -er '.[0].manifest_path')"
          test -d "$object_root"
          test -f "$manifest"
          test -z "$(find "$object_root" -type l -print -quit)"
          test -z "$(find "$object_root" -type d ! -perm 0700 -print -quit)"
          test -z "$(find "$object_root" -type f ! -perm 0600 -print -quit)"
          test "$(stat -c '%a' "$manifest")" = 600

          second="$(
            cargo run -q -p hazards-cli --bin hazards-cargo-dependencies -- \
              --tool alacritty \
              --host desktop \
              --persistence local \
              --role development \
              --json
          )"
          printf '%s\n' "$second" | jq -e '
            length == 1 and
            .[0].receipt.outcome == "cache_hit" and
            .[0].receipt.dependency_count == 291 and
            .[0].receipt.downloaded_count == 0 and
            .[0].receipt.cache_hit_count == 291
          '

          victim="$(printf '%s\n' "$second" | jq -er '.[0].packages[0].object_path')"
          printf 'tampered acceptance evidence' > "$victim"
          if cargo run -q -p hazards-cli --bin hazards-cargo-dependencies -- \
            --tool alacritty \
            --host desktop \
            --persistence local \
            --role development \
            --json
          then
            echo 'corrupt dependency object was unexpectedly accepted' >&2
            exit 1
          fi
          test "$(cat "$victim")" = 'tampered acceptance evidence'
          echo 'real Cargo dependency cache acceptance: PASS'

      - name: Remove completed acceptance workflow
        run: |
          set -euo pipefail
          rm -- .github/workflows/accept-cargo-dependency-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/accept-cargo-dependency-cache.yml
          git commit -m 'Remove completed dependency cache acceptance workflow'
          git push origin HEAD:agent/offline-cargo-dependency-cache
