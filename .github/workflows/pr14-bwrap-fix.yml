name: PR14 Bubblewrap mapping fix

on:
  push:
    branches: [agent/controlled-source-build]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Record temporary PR14 acceptance') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/controlled-source-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply namespace identity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rust = Path("crates/hazards-core/src/build_contract/probe_support.rs")
          text = rust.read_text()
          if '"--uid".to_owned()' not in text:
              old = '''        "--unshare-user".to_owned(),
                  "--unshare-pid".to_owned(),
              '''
              new = '''        "--unshare-user".to_owned(),
                  "--uid".to_owned(),
                  "0".to_owned(),
                  "--gid".to_owned(),
                  "0".to_owned(),
                  "--unshare-pid".to_owned(),
              '''
              assert text.count(old) == 1
              rust.write_text(text.replace(old, new))

          workflow = Path(".github/workflows/pr14-acceptance.yml")
          text = workflow.read_text()
          old = '''          mkdir -p pr14-acceptance
              if test -d acceptance; then
              '''
          new = '''          rm -rf pr14-acceptance
              mkdir -p pr14-acceptance
              if test -d acceptance; then
              '''
          if old in text:
              text = text.replace(old, new)
          workflow.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hazards-core/src/build_contract/probe_support.rs \
                  .github/workflows/pr14-acceptance.yml
          git diff --cached --quiet && exit 0
          git commit -m "Map the Bubblewrap namespace identity"
          git push origin HEAD:agent/controlled-source-build
