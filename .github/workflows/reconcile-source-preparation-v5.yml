name: Reconcile source preparation v5

on:
  push:
    branches:
      - agent/controlled-source-preparation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/controlled-source-preparation

      - name: Reconcile, validate, and report
        shell: bash
        run: |
          set +e
          log=/tmp/reconcile-source-preparation.log

          (
            set -euo pipefail

            rustup toolchain install stable --profile minimal --component rustfmt,clippy
            rustup toolchain install 1.85.0 --profile minimal
            rustup default stable

            python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/reconcile-source-preparation.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          encoded = source[start:end]
          lines = []
          for line in encoded.splitlines():
              if line == '':
                  lines.append('')
              elif line.startswith('          '):
                  lines.append(line[10:])
              else:
                  raise SystemExit(f'unexpected patch-script indentation: {line!r}')
          script = '\n'.join(lines) + '\n'
          docs_marker = '\nreplace_once(\n    "README.md",'
          script = script[:script.index(docs_marker)]

          script += r'''

          def lines(*values: str) -> str:
              return "\n".join(values) + "\n"

          replace_once(
              "README.md",
              lines(
                  "$ cargo run -p hazards-cli -- provision acquire \\",
                  "    --tool zellij \\",
                  "    --host desktop \\",
                  "    --persistence local \\",
                  "    --role development",
                  "$ cargo run -p hazards-cli -- provision materialize \\",
              ),
              lines(
                  "$ cargo run -p hazards-cli -- provision acquire \\",
                  "    --tool zellij \\",
                  "    --host desktop \\",
                  "    --persistence local \\",
                  "    --role development",
                  "$ cargo run -p hazards-cli --bin hazards-source-prepare -- \\",
                  "    --tool alacritty \\",
                  "    --host desktop \\",
                  "    --persistence local \\",
                  "    --role development",
                  "$ cargo run -p hazards-cli -- provision materialize \\",
              ),
          )

          replace_once(
              "README.md",
              "`hazards provision materialize` is the next deliberately narrow mutation. It\n",
              lines(
                  "`hazards-source-prepare` is the next explicit mutation boundary for locked",
                  "crates. It requires a verified cached source object and independently revalidates",
                  "the artifact method, format, digest evidence, package identity, source root,",
                  "published manifest, lockfile, and complete Cargo graph before creating state. The",
                  "exact compressed bytes consumed during extraction are hashed and counted again,",
                  "preventing a changed object from being smuggled between verification and source",
                  "preparation.",
                  "",
                  "Only bounded regular files and directories beneath the single locked source root",
                  "are accepted. Archived permissions, ownership, and timestamps are discarded;",
                  "directories become mode `0700` and files become mode `0600`. The complete tree is",
                  "inventoried beneath `~/.cache/hazards/sources/sha256`, then atomically persisted",
                  "with a private identity manifest. Existing trees are freshly reproduced and",
                  "compared before a `stage_hit` is reported. Append-only evidence lives under",
                  "`~/.local/state/hazards/receipts/source-preparations/<tool>/<version>`.",
                  "",
                  "Source preparation performs no network request, Cargo invocation, dependency",
                  "download, build-script execution, compilation, executable permission change,",
                  "installation, activation, or `PATH` mutation. The result is inert reviewed input",
                  "for a later build authority—not a cunningly renamed `cargo install`.",
                  "",
                  "`hazards provision materialize` is the next deliberately narrow mutation. It",
              ),
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              "## Safe materialization\n",
              lines(
                  "## Controlled source preparation",
                  "",
                  "`hazards-source-prepare` converts an explicitly selected, graph-locked crates.io",
                  "object into inert private source staging. Its authority stops at:",
                  "",
                  "- content-addressed trees under",
                  "  `$XDG_CACHE_HOME/hazards/sources/sha256/<prefix>/<artifact-digest>`;",
                  "- append-only JSON receipts under",
                  "  `$XDG_STATE_HOME/hazards/receipts/source-preparations/<tool>/<version>`.",
                  "",
                  "The companion command independently revalidates the cached object's method,",
                  "format, digest evidence, type, byte count, SHA-256 digest, package identity, source",
                  "root, pinned manifest and lockfile, registry sources, dependency checksums, and",
                  "graph counts. Extraction then hashes and counts the exact compressed stream it",
                  "consumes, so a cache-path replacement or in-place mutation cannot silently cross",
                  "the verification-to-extraction boundary.",
                  "",
                  "Only bounded regular files and directories beneath the exact locked source root",
                  "are accepted. Absolute paths, parent components, backslashes, links, special",
                  "entries, duplicate paths, excessive entry sizes, and excessive aggregate",
                  "expansion fail closed. Archived permissions, ownership, and timestamps are",
                  "discarded. HAZARDS creates directories as `0700` and files as `0600`.",
                  "",
                  "A deterministic manifest binds the acquisition digest, Cargo identities, package",
                  "counts, and every staged file's relative path, size, and SHA-256. Persistence is",
                  "an atomic rename from a private sibling candidate. Existing staging is never",
                  "trusted by its content-addressed name: HAZARDS reproduces a fresh candidate,",
                  "validates the existing manifest and actual tree, and requires complete equality",
                  "before reporting `stage_hit`.",
                  "",
                  "This phase performs no network request, Cargo invocation, dependency retrieval,",
                  "build-script execution, compiler or linker execution, executable permission",
                  "change, installation, activation, or `PATH` mutation. The resulting source is",
                  "inert build input. Dependency acquisition, toolchain identity, native libraries,",
                  "sandboxed execution, output identity, installation, and rollback remain separate",
                  "authorization boundaries.",
                  "",
                  "## Safe materialization",
              ),
          )

          replace_once(
              "docs/ROADMAP.md",
              lines(
                  "- [x] Controlled private source preparation without Cargo execution",
                  "- [ ] Signed provenance and controlled source-build execution",
              ),
              lines(
                  "- [x] Controlled private source preparation without Cargo execution",
                  "- [ ] Offline checksum-verified Cargo dependency cache",
                  "- [ ] Pinned Rust toolchain and native build contract",
                  "- [ ] Controlled source-build execution and result verification",
                  "- [ ] Signed provenance policy",
              ),
          )

          replace_once(
              "docs/SOURCE_PREPARATION.md",
              lines(
                  "access. It rechecks the archive digest, safely extracts the single locked crate",
                  "root, independently revalidates the published manifest and Cargo lock, hashes",
                  "the complete source tree, and writes append-only evidence.",
              ),
              lines(
                  "access. It rechecks the archive digest, hashes and counts the exact compressed",
                  "stream consumed during extraction, safely extracts the single locked crate root,",
                  "independently revalidates the published manifest and Cargo lock, hashes the",
                  "complete source tree, and writes append-only evidence.",
              ),
          )

          replace_once(
              "docs/adr/0011-controlled-source-preparation.md",
              lines(
                  "2. requires an existing content-addressed cache object and independently checks",
                  "   its type, byte count, and SHA-256 digest;",
                  "3. extracts only the locked crates.io TAR/GZip shape beneath its single expected",
              ),
              lines(
                  "2. requires an existing content-addressed cache object and independently checks",
                  "   its type, byte count, and SHA-256 digest;",
                  "3. hashes and counts the exact compressed stream consumed during extraction;",
                  "4. extracts only the locked crates.io TAR/GZip shape beneath its single expected",
              ),
          )

          adr = Path("docs/adr/0011-controlled-source-preparation.md")
          text = adr.read_text()
          for old, new in [
              ("4. accepts", "5. accepts"),
              ("5. rejects", "6. rejects"),
              ("6. discards", "7. discards"),
              ("7. independently", "8. independently"),
              ("8. inventories", "9. inventories"),
              ("9. atomically", "10. atomically"),
              ("10. writes", "11. writes"),
          ]:
              if old not in text:
                  raise SystemExit(f"ADR renumber anchor missing: {old}")
              text = text.replace(old, new, 1)
          adr.write_text(text)
          '''

          Path('/tmp/reconcile.py').write_text(script)
          PY
            python3 /tmp/reconcile.py

            cargo fmt --all
            cargo fmt --all --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
            cargo +1.85.0 check --workspace --all-targets

            export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
            export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            export HAZARDS_ACCEPT_HOME="$(mktemp -d)"
            trap 'rm -rf -- "$HAZARDS_ACCEPT_HOME"' EXIT
            export HOME="$HAZARDS_ACCEPT_HOME/home"
            export XDG_CONFIG_HOME="$HAZARDS_ACCEPT_HOME/config"
            export XDG_CACHE_HOME="$HAZARDS_ACCEPT_HOME/cache"
            export XDG_STATE_HOME="$HAZARDS_ACCEPT_HOME/state"
            mkdir -p "$HOME"

            cargo run -q -p hazards-cli -- provision acquire \
              --tool alacritty \
              --host desktop \
              --persistence local \
              --role development

            first="$(
              cargo run -q -p hazards-cli --bin hazards-source-prepare -- \
                --tool alacritty \
                --host desktop \
                --persistence local \
                --role development \
                --json
            )"
            printf '%s\n' "$first" | jq -e 'length == 1 and .[0].receipt.outcome == "prepared"'
            stage="$(printf '%s\n' "$first" | jq -er '.[0].staging_path')"
            test -d "$stage"
            test -z "$(find "$stage" -type l -print -quit)"
            test -z "$(find "$stage" -type d ! -perm 0700 -print -quit)"
            test -z "$(find "$stage" -type f ! -perm 0600 -print -quit)"

            second="$(
              cargo run -q -p hazards-cli --bin hazards-source-prepare -- \
                --tool alacritty \
                --host desktop \
                --persistence local \
                --role development \
                --json
            )"
            printf '%s\n' "$second" | jq -e 'length == 1 and .[0].receipt.outcome == "stage_hit"'
            echo 'real source-preparation acceptance: PASS'
          ) >"$log" 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            {
              echo 'PASS'
              echo
              cat "$log"
            } > reconcile-source-preparation-status.txt
            message='Harden source preparation stream identity'
            git add \
              crates/hazards-core/src/source_prepare/archive.rs \
              README.md \
              docs/ARCHITECTURE.md \
              docs/ROADMAP.md \
              docs/SOURCE_PREPARATION.md \
              docs/adr/0011-controlled-source-preparation.md \
              reconcile-source-preparation-status.txt
          else
            git reset --hard HEAD
            {
              echo "FAIL (exit $status)"
              echo
              cat "$log"
            } > reconcile-source-preparation-status.txt
            message='Record source preparation reconciliation failure'
            git add reconcile-source-preparation-status.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$message"
          git push origin HEAD:agent/controlled-source-preparation
