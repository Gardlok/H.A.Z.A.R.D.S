name: Finalize build contract code

on:
  push:
    branches:
      - agent/pinned-build-contract

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pinned-build-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply diagnosed corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          util = Path('crates/hazards-core/src/build_contract/util.rs')
          text = util.read_text()
          text = text.replace(
              '    let mut file = File::open(path)?;\n',
              '    let file = File::open(path)?;\n',
          )
          text = text.replace(
              '''pub(super) fn safe_command(value: &str) -> bool {
              safe_component(value)
          }
          ''',
              '''pub(super) fn safe_command(value: &str) -> bool {
              !value.is_empty()
                  && value != "."
                  && value != ".."
                  && value.bytes().all(|byte| {
                      byte.is_ascii_alphanumeric() || matches!(byte, b'-' | b'_' | b'.' | b'+')
                  })
          }
          ''',
          )
          util.write_text(text)

          probes = Path('crates/hazards-core/src/build_contract/probe_support.rs')
          text = probes.read_text().replace(
              '''                (Some(_), None) => false,
                              (None, _) => true,
              ''',
              '''                (Some(_), None) => false,
                              (None, Some(_)) => true,
                              (None, None) => false,
              ''',
          )
          probes.write_text(text)

          tests = Path('crates/hazards-core/src/build_contract/tests.rs')
          text = tests.read_text()
          marker = '#[derive(Default)]\nstruct FakeProbe {\n'
          aliases = '''type ProbeKey = (PathBuf, Vec<String>);
          type ProbeOutput = Result<String, String>;
          type ProbeOutputs = BTreeMap<ProbeKey, ProbeOutput>;

          #[derive(Default)]
          struct FakeProbe {
          '''
          if marker not in text:
              raise SystemExit('test fixture marker not found')
          text = text.replace(marker, aliases, 1)
          text = text.replace(
              '    outputs: Mutex<BTreeMap<(PathBuf, Vec<String>), Result<String, String>>>,\n',
              '    outputs: Mutex<ProbeOutputs>,\n',
          )
          tests.write_text(text)
          PY
      - name: Format and capture validation
        run: |
          set -u
          cargo fmt --all
          : > .hazards-build-contract-validation.log
          status=0
          for command in \
            'cargo check --workspace' \
            'cargo clippy --workspace --all-targets -- -D warnings' \
            'cargo test --workspace'
          do
            printf '\n$ %s\n' "$command" >> .hazards-build-contract-validation.log
            if ! bash -o pipefail -c "$command" >> .hazards-build-contract-validation.log 2>&1; then
              status=1
            fi
          done
          printf '\nvalidation_status=%s\n' "$status" >> .hazards-build-contract-validation.log
      - name: Commit result
        run: |
          set -euo pipefail
          status="$(sed -n 's/^validation_status=//p' .hazards-build-contract-validation.log | tail -1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test "$status" = 0
          then
            rm -- .hazards-build-contract-validation.log
            rm -- .github/workflows/finalize-build-contract-code.yml
            git add --all
            git commit -m 'Finalize pinned build contract implementation'
          else
            git add --all
            git commit -m 'Record pinned build contract validation failure'
          fi
          git push origin HEAD:agent/pinned-build-contract
