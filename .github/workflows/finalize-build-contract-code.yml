name: Finalize build contract code

on:
  push:
    branches:
      - agent/pinned-build-contract

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pinned-build-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit validated formatting
        run: |
          set -euo pipefail
          rm -- .github/workflows/finalize-build-contract-code.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Finalize pinned build contract implementation'
          git push origin HEAD:agent/pinned-build-contract
