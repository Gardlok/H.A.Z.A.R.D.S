[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
dynamic_title = true
opacity = 0.97
padding = { x = 6, y = 6 }

[scrolling]
history = 50_000
multiplier = 3

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true
