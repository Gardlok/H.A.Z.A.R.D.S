theme = "autumn_night"

[editor]
auto-format = true
bufferline = "multiple"
color-modes = true
cursorline = true
line-number = "relative"
mouse = false
scrolloff = 8
true-color = true
rulers = [100]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[keys.normal]
C-s = ":write"
