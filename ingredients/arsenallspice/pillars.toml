schema_version = 2

[[pillars]]
letter = "H"
id = "helix"
name = "Helix"
ingredient = "helixer"
kind = "external"
command = "hx"
summary = "Editing and language tooling"

[pillars.install]
source = "github_release"
locator = "helix-editor/helix"
target_version = "25.07.1"
destination = "~/.local/bin"
platforms = ["linux"]

[[pillars]]
letter = "A"
id = "alacritty"
name = "Alacritty"
ingredient = "alacarte"
kind = "external"
command = "alacritty"
summary = "Local terminal presentation"

[pillars.install]
source = "github_release"
locator = "alacritty/alacritty"
target_version = "0.17.0"
destination = "~/.local/bin"
platforms = ["linux"]

[[pillars]]
letter = "Z"
id = "zellij"
name = "Zellij"
ingredient = "zellijuice"
kind = "external"
command = "zellij"
summary = "Sessions, panes, layouts, and remote continuity"

[pillars.install]
source = "github_release"
locator = "zellij-org/zellij"
target_version = "0.44.3"
destination = "~/.local/bin"
platforms = ["linux"]

[[pillars]]
letter = "A"
id = "arsenal"
name = "Arsenal"
ingredient = "arsenallspice"
kind = "internal"
summary = "HAZARDS control plane and tool registry"

[[pillars]]
letter = "R"
id = "rhai"
name = "Rhai"
ingredient = "rhaisour"
kind = "embedded"
summary = "Sandboxed recipes and automation"

[[pillars]]
letter = "D"
id = "dotter"
name = "Dotter"
ingredient = "dotterbatter"
kind = "external"
command = "dotter"
summary = "Profile-aware configuration deployment"

[pillars.install]
source = "github_release"
locator = "SuperCuber/dotter"
target_version = "0.13.5"
destination = "~/.local/bin"
platforms = ["linux"]

[[pillars]]
letter = "S"
id = "surrealdb"
name = "SurrealDB"
ingredient = "surrelish"
kind = "planned"
summary = "Planned project, host, workspace, and run metadata"

[[providers]]
id = "atuin"
name = "Atuin"
command = "atuin"
summary = "Contextual shell history and optional encrypted synchronization"

[providers.install]
source = "github_release"
locator = "atuinsh/atuin"
target_version = "18.17.1"
destination = "~/.local/bin"
platforms = ["linux"]

[[providers]]
id = "ripgrep"
